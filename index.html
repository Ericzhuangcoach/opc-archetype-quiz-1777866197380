#quiz{display:none;flex:1;flex-direction:column}

.report-name{font-size:1.6rem;font-weight:800;margin-bottom:6px}
.report-title{font-size:1.1rem;color:#6C5CE7;font-weight:600;margin-bottom:4px}
.report-subtitle{font-size:.9rem;color:#999}
.chart-box{width:300px;height:300px;margin:20px auto}

.archetype-card:last-child{margin-bottom:0}
.archetype-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}

var currentQ=0,scores={},userName='';

function startQuiz(){
  userName=document.getElementById('userName').value.trim();
  if(!userName){alert('请输入你的名字');return;}
  archetypes.forEach(function(a){scores[a.id]=0;});
  currentQ=0;
  document.getElementById('cover').style.display='none';
  document.getElementById('quiz').style.display='flex';
  showQuestion();
}

function showQuestion(){
  document.getElementById('progressFill').style.width=(currentQ/24*100)+'%';
  document.getElementById('questionNum').textContent='第 '+(currentQ+1)+'/24 题';
  document.getElementById('questionText').textContent=qs[currentQ];
  var box=document.getElementById('optionsBox');
  box.innerHTML='';
  var letters=['A','B','C','D'];
  for(var i=0;i<4;i++){
    (function(idx){
      var btn=document.createElement('div');
      btn.className='option-btn';
      btn.innerHTML='<span class="option-letter">'+letters[idx]+'</span><span>'+opts[currentQ][idx]+'</span>';
      btn.onclick=function(ev){selectOption(idx,ev);};
      box.appendChild(btn);
    })(i);
  }
}

function selectOption(i,ev){
  /* 先清除所有选中态 */
  var siblings=document.getElementById('optionsBox').querySelectorAll('.option-btn');
  for(var j=0;j<siblings.length;j++){siblings[j].classList.remove('selected');}
  if(ev){ev.currentTarget.classList.add('selected');}else{
    var btns=document.getElementById('optionsBox').querySelectorAll('.option-btn');
    if(btns[i])btns[i].classList.add('selected');
  }
  var archId=qMap[currentQ][i];
  scores[archId]=(scores[archId]||0)+1;
  setTimeout(function(){
    currentQ++;
    if(currentQ<24) showQuestion();
    else finishQuiz();
  },350);
}

function finishQuiz(){
  document.getElementById('quiz').style.display='none';
  localStorage.setItem('crystalmind_opc_done','1');
  var sorted=archetypes.slice().sort(function(a,b){return scores[b.id]-scores[a.id];});
  var data={
    name:userName,
    scores:scores,
    dominant:sorted[0],
    shadow:sorted[11],
    top3:sorted.slice(0,3),
    bottom3:sorted.slice(9)
  };
  localStorage.setItem('crystalmind_opc_report',JSON.stringify(data));
  showReport(data);
}

function showReport(data){
  document.getElementById('report').style.display='block';
  document.getElementById('rName').textContent=data.name+'，这是你的领导力原型报告';
  document.getElementById('dominantSection').innerHTML=
    '<h3>🏆 你的主导原型</h3><div class="archetype-card">'+
    '<div class="archetype-icon" style="background:'+data.dominant.color+'20;color:'+data.dominant.color+'">'+data.dominant.name[0]+'</div>'+
    '<div class="archetype-info"><h4>'+data.dominant.name+'</h4><p>'+data.dominant.desc+'</p></div></div>';
  document.getElementById('shadowSection').innerHTML=
    '<h3>🔮 你的阴影原型</h3><div class="archetype-card">'+
    '<div class="archetype-icon" style="background:'+data.shadow.color+'20;color:'+data.shadow.color+'">'+data.shadow.name[0]+'</div>'+
    '<div class="archetype-info"><h4>'+data.shadow.name+'</h4><p>这是你较低能量的原型，意识到它可以帮你整合内在对立面，实现更完整的自我。</p></div></div>';
  var t3='<h3>💪 TOP3 核心优势</h3>';
  data.top3.forEach(function(a,i){t3+='<div class="archetype-card"><div class="archetype-icon" style="background:'+a.color+'20;color:'+a.color+'">'+(i+1)+'</div><div class="archetype-info"><h4>'+a.name+'</h4><p>'+a.desc+'</p></div></div>';});
  document.getElementById('advantageSection').innerHTML=t3;
  var p3='<h3>🔋 待激活潜能</h3>';
  data.bottom3.forEach(function(a){p3+='<div class="archetype-card"><div class="archetype-icon" style="background:'+a.color+'20;color:'+a.color+'">激活</div><div class="archetype-info"><h4>'+a.name+'</h4><p>刻意练习'+a.name+'能量，可以为你的OPC事业带来新的可能性。</p></div></div>';});
  document.getElementById('potentialSection').innerHTML=p3;
  var areas=['战略规划','客户关系','团队领导','创新突破'];
  var tips=['作为'+data.dominant.name+'，你在OPC创业中的核心优势是'+data.dominant.desc+'，请持续放大这一优势。','有意识地激活你的'+data.bottom3[0].name+'能量，可以帮助你在'+areas[Math.floor(Math.random()*areas.length)]+'方面获得突破。','OPC创业不是孤军奋战，找到和你互补的同行者，让你的'+data.top3.map(function(a){return a.name;}).join('+')+'优势得到最大发挥。','定期做原型能量自查：哪几个原型在今天的工作中「在线」？哪几个在「休眠」？有意识地调用需要激活的原型能量。','《人生转型加速器》可以帮助你更系统地整合12原型能量，从超级个体进化为真正的原型CEO。'];
  var th='<h3>🎯 OPC发展建议</h3>';
  tips.forEach(function(t,i){th+='<div class="tip-box" data-num="'+(i+1)+'">'+t+'</div>';});
  document.getElementById('tipSection').innerHTML=th;
  drawRadar(data);
}

function drawRadar(data){
  var svg=document.getElementById('radarSvg');
  svg.innerHTML='';
  var n=12,cx=0,cy=0,r=120;
  function toRad(d){return d*Math.PI/180;}
  function getPt(i,val){
    var a=toRad(90+i*360/n);
    var vr=(val/8)*r;
    return{x:cx+vr*Math.cos(a),y:cy-vr*Math.sin(a)};
  }
  for(var lvl=1;lvl<=4;lvl++){
    var lr=(lvl/4)*r;
    var pts=[];
    for(var i=0;i<n;i++){
      var a=toRad(90+i*360/n);
      pts.push((cx+lr*Math.cos(a))+','+(cy-lr*Math.sin(a)));
    }
    var poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points',pts.join(' '));
    poly.setAttribute('fill',lvl===4?'rgba(108,92,231,0.05)':'none');
    poly.setAttribute('stroke','rgba(0,0,0,0.08)');
    poly.setAttribute('stroke-width','1');
    svg.appendChild(poly);
  }
  for(var i=0;i<n;i++){
    var a=toRad(90+i*360/n);
    var ex=cx+r*Math.cos(a),ey=cy-r*Math.sin(a);
    var line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',cx);line.setAttribute('y1',cy);line.setAttribute('x2',ex);line.setAttribute('y2',ey);
    line.setAttribute('stroke','rgba(0,0,0,0.08)');
    line.setAttribute('stroke-width','1');
    svg.appendChild(line);
    var lp=getPt(i,8.5);
    var txt=document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',lp.x);txt.setAttribute('y',lp.y+4);
    txt.setAttribute('text-anchor','middle');txt.setAttribute('font-size','11');
    txt.setAttribute('fill','#555');
    txt.textContent=archetypes[i].name;
    svg.appendChild(txt);
  }
  var vals=archetypes.map(function(a){return data.scores[a.id]||0;});
  var dPts=[];
  for(i=0;i<n;i++){var p=getPt(i,vals[i]);dPts.push(p.x+','+p.y);}
  var dp=document.createElementNS('http://www.w3.org/2000/svg','polygon');
  dp.setAttribute('points',dPts.join(' '));
  dp.setAttribute('fill','rgba(108,92,231,0.2)');
  dp.setAttribute('stroke','rgba(108,92,231,0.8)');
  dp.setAttribute('stroke-width','2');
  svg.appendChild(dp);
  for(i=0;i<n;i++){
    var p=getPt(i,vals[i]);
    var dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);dot.setAttribute('r','4');
    dot.setAttribute('fill',archetypes[i].color);
    dot.setAttribute('stroke','#fff');dot.setAttribute('stroke-width','2');
    svg.appendChild(dot);
  }
}

function showReportFromStorage(){
  var raw=localStorage.getItem('crystalmind_opc_report');
  if(!raw){alert('未找到报告数据');return;}
  document.getElementById('cover').style.display='none';
  document.getElementById('done').style.display='none';
  showReport(JSON.parse(raw));
}

/* 初始化绑定 */
window.onload=function(){
  document.getElementById('startBtn').onclick=startQuiz;
  document.getElementById('userName').onkeydown=function(e){if(e.key==='Enter')startQuiz();};
  document.getElementById('viewReportBtn').onclick=function(e){e.preventDefault();showReportFromStorage();};
  if(localStorage.getItem('crystalmind_opc_done')){
    document.getElementById('cover').style.display='none';
    document.getElementById('done').style.display='flex';
  }
  
};
